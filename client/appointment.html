<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment | MindCare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/appointment.css?v=6.0">
    <link rel="stylesheet" href="css/dark-theme.css?v=6.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <section class="hero">

        <h1>Book Your Therapy Session</h1>

        <p>

            Choose your therapist and preferred session time.

        </p>

    </section>

    <div class="therapist-card">

        <img id="doctorImage" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Therapist">

        <div>

            <h2 id="doctorName">Select Therapist</h2>

            <p id="doctorSpecialization">Clinical Psychologist</p>

            <p>⭐ <span id="doctorRating">4.9</span></p>

            <p>Experience :
                <span id="doctorExperience">8 Years</span>
            </p>

        </div>

    </div>

    <section class="booking">

        <div class="booking-card">

            <h2>Appointment Details</h2>

            <form id="bookingForm">

                <div class="row">

                    <div class="input-group">

                        <label><i class="fa-solid fa-user" style="color: #4f46e5; margin-right: 6px;"></i> Full Name</label>

                        <input type="text" id="fullName" placeholder="Enter your full name" required>

                    </div>

                    <div class="input-group">

                        <label><i class="fa-solid fa-envelope" style="color: #4f46e5; margin-right: 6px;"></i> Email</label>

                        <input type="email" id="email" placeholder="Enter email" required>

                    </div>

                </div>

                <div class="row">

                    <div class="input-group">

                        <label><i class="fa-solid fa-phone" style="color: #4f46e5; margin-right: 6px;"></i> Phone Number</label>

                        <input type="tel" id="phone" placeholder="+91 XXXXXXXXXX" required>

                    </div>

                    <div class="input-group">

                        <label><i class="fa-solid fa-user-doctor" style="color: #4f46e5; margin-right: 6px;"></i> Selected Therapist</label>

                        <input type="text" id="therapist" readonly>

                    </div>

                </div>

                <div class="row">

                    <div class="input-group">

                        <label><i class="fa-solid fa-calendar-days" style="color: #4f46e5; margin-right: 6px;"></i> Appointment Date</label>

                        <input type="date" id="date" required>

                    </div>

                    <div class="input-group">

                        <label><i class="fa-solid fa-clock" style="color: #4f46e5; margin-right: 6px;"></i> Time Slot</label>

                        <select id="time" required>

                            <option>09:00 AM</option>

                            <option>09:30 AM</option>

                            <option>10:00 AM</option>

                            <option>10:30 AM</option>

                            <option>11:00 AM</option>

                            <option>11:30 AM</option>

                            <option>12:00 PM</option>

                            <option>12:30 PM</option>

                            <option>01:00 PM</option>

                            <option>01:30 PM</option>

                            <option>02:00 PM</option>

                            <option>02:30 PM</option>

                            <option>03:00 PM</option>

                            <option>03:30 PM</option>

                            <option>04:00 PM</option>

                            <option>04:30 PM</option>

                            <option>05:00 PM</option>

                            <option>05:30 PM</option>

                            <option>06:00 PM</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="input-group">

                        <label><i class="fa-solid fa-video" style="color: #4f46e5; margin-right: 6px;"></i> Session Mode</label>

                        <select id="mode" required>

                            <option>Video Call</option>

                            <option>Voice Call</option>

                            <option>Live Chat</option>

                        </select>

                    </div>

                    <div class="input-group">

                        <label>Age</label>

                        <input type="number" id="age" placeholder="Enter age" required>

                    </div>

                </div>

                <div class="input-group">

                    <label>Your Concern</label>

                    <textarea id="concern" placeholder="Describe your concern..." rows="5"></textarea>

                </div>

                <div class="price-box">

                    <h3>Consultation Fee</h3>

                    <h1 id="fee">₹999</h1>

                    <p>Duration : 30 Minutes</p>

                </div>

                <button type="submit">

                    Confirm Appointment

                </button>

            </form>

        </div>

    </section>

    <footer>

        <p>

            © 2026 MindCare |

            Your Mental Health Matters ❤️

        </p>

    </footer>
    <script src="js/theme.js?v=7.0"></script>
    <script src="js/appointment.js?v=7.0"></script>

</body>

</html>
