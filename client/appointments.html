<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Appointments | MindCare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/appointments.css?v=4.0">
    <link rel="stylesheet" href="css/dark-theme.css?v=4.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <section class="hero">

        <h1>My Appointments</h1>

        <p>
            View and manage your therapy appointments.
        </p>

    </section>


    <main class="appointments-container">

        <div class="page-title">

            <h2>Your Appointments</h2>

            <a href="therapists.html" class="book-btn">

                <i class="fa-solid fa-plus"></i>

                Book New Appointment

            </a>

        </div>


        <!-- ================= UPCOMING APPOINTMENTS ================= -->
        <div id="appointmentsList">
            <div class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Loading appointments...
            </div>
        </div>

        <!-- ================= CANCELLED & MISSED APPOINTMENTS ================= -->
        <div style="margin-top: 50px;">
            <div class="page-title">
                <h2 style="color: #dc2626;"><i class="fa-solid fa-calendar-xmark" style="margin-right: 8px;"></i> Cancelled & Missed Sessions</h2>
            </div>

            <div id="cancelledAppointmentsList">
            </div>
        </div>

    </main>


    <footer>

        <p>

            © 2026 MindCare |

            Your Mental Health Matters ❤️

        </p>

    </footer>


    <script src="js/theme.js?v=7.0"></script>
    <script src="js/appointments.js?v=7.0"></script>

</body>

</html>
