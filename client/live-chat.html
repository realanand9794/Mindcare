<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Consultation Chat | MindCare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/live-chat.css?v=4.0">
    <link rel="stylesheet" href="css/dark-theme.css?v=4.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="whatsapp-app-container">

        <!-- Left Sidebar: Booked Therapists Conversations List -->
        <aside class="whatsapp-sidebar">

            <!-- Booked Therapists List -->
            <div class="conversations-list" id="conversationsList">
                <!-- Dynamically populated only with therapists user has booked appointments with -->
            </div>

        </aside>

        <!-- Right Main Chat Panel -->
        <main class="whatsapp-chat-panel">

            <!-- Active Chat Header -->
            <header class="chat-header">
                <div class="chat-header-left">
                    <button id="mobileBackBtn" class="mobile-back-btn" title="Back to Conversations">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <img id="activeTherapistImg" src="https://randomuser.me/api/portraits/women/44.jpg"
                        alt="Therapist Image">
                    <div class="active-therapist-info">
                        <h3 id="activeTherapistName">Dr. Sarah Wilson</h3>
                        <p id="activeTherapistStatus"><span class="online-dot">●</span> online • session active</p>
                    </div>
                </div>

                <div class="chat-header-actions">
                    <a id="headerVoiceCallBtn" href="video-call.html?mode=audio" class="chat-icon-btn"
                        title="Start Voice Call">
                        <i class="fa-solid fa-phone"></i>
                    </a>
                    <a id="headerVideoCallBtn" href="video-call.html" class="chat-icon-btn" title="Start Video Call">
                        <i class="fa-solid fa-video"></i>
                    </a>
                </div>
            </header>

            <!-- Messages Stream Area -->
            <div class="chat-messages-area" id="chatMessagesArea">
                <div class="chat-encryption-banner">
                    <i class="fa-solid fa-lock"></i>
                    <span>Messages and calls are end-to-end encrypted. No one outside of this therapy session can read
                        or listen to them.</span>
                </div>

                <!-- Messages, Video Call Recordings, and Voice Call Recordings render dynamically here -->
            </div>

            <!-- Chat Input Footer -->
            <footer class="chat-footer">
                <button class="footer-icon-btn" title="Emojis">
                    <i class="fa-regular fa-face-smile"></i>
                </button>
                <button class="footer-icon-btn" title="Attach Document / Image">
                    <i class="fa-solid fa-paperclip"></i>
                </button>

                <form id="whatsappMessageForm" class="footer-input-form">
                    <input type="text" id="whatsappMessageInput" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="whatsappSendBtn" class="send-message-btn" title="Send Message">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </footer>

        </main>

    </div>

    <!-- Video Playback Modal -->
    <div id="videoPlaybackModal" class="video-modal-overlay" style="display: none;">
        <div class="video-modal-box">
            <div class="video-modal-header">
                <h3><i class="fa-solid fa-video" style="color: #6366f1;"></i> Consultation Video Call Recording</h3>
                <button id="closeVideoModalBtn" class="close-modal-btn">&times;</button>
            </div>
            <video id="modalVideoPlayer" controls width="100%" style="border-radius: 12px; margin-top: 10px;">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/live-chat.js"></script>

</body>

</html>
