<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | MindCare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/dark-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-group button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .edit-btn { background: #4f46e5; color: white; }
        .logout-btn { background: #ef4444; color: white; }
        .cancel-btn { background: #64748b; color: white; }

        /* Modal styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-card h2 {
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4f46e5;
            margin: 10px auto;
            display: block;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <div style="position: relative; display: inline-block;">
            <img id="profileAvatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="avatar" alt="Avatar">
        </div>

        <h1 id="fullName">Loading...</h1>
        <p id="email"></p>

        <div class="info">
            <p><strong>User ID:</strong> <span id="userId"></span></p>
            <p><strong>Date of Birth (DOB):</strong> <span id="dob">Not set</span></p>
            <p><strong>Phone:</strong> <span id="phone"></span></p>
            <p><strong>Gender:</strong> <span id="gender"></span></p>
            <p><strong>Age:</strong> <span id="age"></span></p>
            <p><strong>Role:</strong> <span id="role" style="text-transform: capitalize;"></span></p>
        </div>

        <div class="btn-group">
            <button class="edit-btn" id="openEditModalBtn">
                <i class="fa-solid fa-user-pen"></i> Edit Profile
            </button>
            <button class="logout-btn" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>

    </div>

    <!-- Edit Profile Modal (Photo File Upload, Name, DOB) -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h2><i class="fa-solid fa-user-pen" style="color: #4f46e5;"></i> Edit Basic Profile</h2>
            <form id="editProfileForm">

                <div class="form-group">
                    <label><i class="fa-solid fa-image"></i> Select Profile Photo (From Device)</label>
                    <input type="file" id="editPhotoFile" accept="image/*">
                    <img id="editPhotoPreview" class="avatar-preview" src="" alt="Preview" style="display: none;">
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label>Date of Birth (DOB)</label>
                    <input type="date" id="editDob">
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="closeEditModalBtn">Cancel</button>
                    <button type="submit" class="edit-btn">Save Profile</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
