<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindCare Consultation</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/video.css?v=16.0">
    <link rel="stylesheet" href="css/dark-theme.css?v=16.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="video-container">

        <!-- Call Area -->
        <div class="video-area">

            <div class="doctor-video" style="position: relative; overflow: hidden;">
                <video id="remoteVideo" autoplay playsinline style="width:100%; height:100%; object-fit:cover; position:absolute; inset:0; z-index:1; border-radius:16px; background:#0f172a; display:none;"></video>
                <img id="doctorAvatar" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Doctor Avatar" style="position:relative; z-index:2;">
                <h3 id="doctorNameHeader" style="position:relative; z-index:2;">Dr. Sarah Wilson</h3>
                <span id="callStatusBadge" class="live" style="position:relative; z-index:2;">● Live Session</span>
            </div>

            <div class="patient-video" id="patientVideoBox">
                <video id="localVideo" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; border-radius:12px; display:none;"></video>
                <img id="patientImg" src="https://randomuser.me/api/portraits/men/45.jpg" alt="Patient Avatar">
                <h4>You</h4>
            </div>

            <div class="controls">
                <button id="micBtn" title="Toggle Microphone">
                    <i class="fas fa-microphone"></i>
                </button>
                <button id="cameraBtn" title="Toggle Camera">
                    <i class="fas fa-video"></i>
                </button>
                <button id="endBtn" class="end-call" title="End Call">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>

            <canvas id="recordingCanvas" width="1280" height="720" style="display:none;"></canvas>
        </div>

    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="js/theme.js?v=32.0"></script>
    <script src="js/video.js?v=32.0"></script>

</body>

</html>
